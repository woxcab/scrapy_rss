x-base: &base
  volumes:
    - .:/home/testuser/scrapy_rss
  user: "$USERID:$GROUPID"
  environment:
    - TOX_PARALLEL_NO_SPINNER=1
    - FORCE_COLOR=1
    - PY_COLORS=1
    - HTTP_PROXY
    - HTTPS_PROXY
    - NO_PROXY

x-build: &default-build
  context: .
  args:
    UNAME: testuser
    USERID: "$USERID"
    GROUPID: "$GROUPID"
    WORKDIR: "/home/testuser/scrapy_rss"
    HTTP_PROXY: "${HTTP_PROXY:-}"
    HTTPS_PROXY: "${HTTPS_PROXY:-}"
    NO_PROXY: "${NO_PROXY:-}"

services:
  py27:
    <<: *base
    build:
      <<: *default-build
      target: py27
  py33:
    <<: *base
    build:
      <<: *default-build
      target: py33
  py34:
    <<: *base
    build:
      <<: *default-build
      target: py34
  py35:
    <<: *base
    build:
      <<: *default-build
      target: py35
  py36:
    <<: *base
    build:
      <<: *default-build
      target: py36
  py37:
    <<: *base
    build:
      <<: *default-build
      target: py37
  py38:
    <<: *base
    build:
      <<: *default-build
      target: py38
  py39:
    <<: *base
    build:
      <<: *default-build
      target: py39
  py310:
    <<: *base
    build:
      <<: *default-build
      target: py310
  py3:
    <<: *base
    build:
      <<: *default-build
      target: py3
  py316:
    <<: *base
    build:
      <<: *default-build
      target: py316
